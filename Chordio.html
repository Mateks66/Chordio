<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chordio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --surface:#000000; --ink:#f3f5f9; --muted:#8f9ab0; --line:#1d2535;
  --accent:#3d8bff; --accent-ink:#000000; --hit:#ff8a1f; --hit-ink:#000000; --cell:#151b27;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:28px 18px 56px}
h1{font:800 clamp(2rem,6vw,3.2rem)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 22px;letter-spacing:-.02em}
.lede{color:var(--muted);margin:0 0 26px;max-width:56ch}
h2{font:700 1.05rem/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--ink);background:var(--cell);border:1px solid transparent;border-radius:10px;padding:9px 13px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.notes button{min-width:54px;font-weight:500}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.roles button{text-align:left;line-height:1.25}
.roles small{display:block;opacity:.75;font-size:.78rem}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tools span{color:var(--muted);font-size:.9rem}
.result-head{margin:26px 0 14px;font:700 clamp(1.3rem,3.6vw,1.8rem)/1.2 "Bricolage Grotesque",system-ui,sans-serif}
.result-head em{font-style:normal;background:var(--hit);color:var(--hit-ink);padding:0 .3em;border-radius:6px}
.group{margin-bottom:22px}
.group h3{margin:0 0 8px;font:500 .95rem "IBM Plex Sans",sans-serif;color:var(--muted)}
.chords{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.chord{background:#000;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:block;width:100%;min-height:0}
.chord:hover{border-color:var(--accent)}
.chord .name{font:800 1.5rem/1.1 "Bricolage Grotesque",system-ui,sans-serif}
.chord .full{color:var(--muted);font-size:.85rem;margin-bottom:8px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.strip i{font:normal 500 .62rem/1 "IBM Plex Sans",sans-serif;text-align:center;padding:7px 0;border-radius:5px;background:var(--cell);color:transparent}
.strip i.on{background:var(--accent);color:var(--accent-ink)}
.strip i.hit{background:var(--hit);color:var(--hit-ink)}
.spell{margin-top:8px;font-size:.88rem;color:var(--muted)}
.spell b{color:var(--ink)}
@media (max-width:480px){.strip i{font-size:.55rem}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,16,30,.6);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sh-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh-name{font:800 2.4rem/1 "Bricolage Grotesque",system-ui,sans-serif}
.sh-head .full{color:var(--muted);font-size:.9rem;margin:2px 0 4px}
.sh-actions{display:flex;gap:8px;flex-shrink:0}
.tabs{display:flex;gap:6px;margin:16px 0 14px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.cap{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.voicings{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.vc .cap{margin-top:4px;display:block}
button.vc{display:block;width:100%;min-height:0;padding:10px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
button.vc:hover{border-color:var(--accent)}
.dg{width:100%;max-width:150px;height:auto}
.dg text{fill:var(--ink);font:500 11px "IBM Plex Sans",sans-serif}
.dg .ln{stroke:var(--muted);stroke-width:1.2}
.dg .nut{stroke:var(--ink);stroke-width:4}
.dg .dot{fill:var(--accent)}
.dg .dot.hit,.dg .op.hit{fill:var(--hit);stroke:var(--hit)}
.dg .op{fill:none;stroke:var(--ink);stroke-width:1.5}
.pk{width:100%;height:auto;display:block}
.pk .wk{fill:#fff;stroke:#7a88a6;stroke-width:1}
.pk .bk{fill:#1c2333;stroke:#7a88a6;stroke-width:1}
.pk .on{fill:var(--accent)}
.pk .hit{fill:var(--hit)}
.pk text{font:500 10px "IBM Plex Sans",sans-serif;pointer-events:none}
.pk text.on{fill:var(--accent-ink)}
.pk text.hit{fill:var(--hit-ink)}
.inv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.inv button{min-height:40px;padding:5px 11px;font-size:.88rem;line-height:1.2;text-align:left}
.inv small{opacity:.75;font-size:.76rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.chips button{min-height:36px;padding:5px 12px;font-size:.9rem;border-radius:999px}
.chips button:disabled{opacity:.4;cursor:default}
.chips small{opacity:.75;margin-left:6px}
h1{display:flex;align-items:center;gap:.3em}
.logo{width:1em;height:1em;flex:none}
.lg-bg{fill:#000;stroke:var(--line);stroke-width:1.5}
.lg-staff line{stroke:var(--muted);stroke-width:1.5;opacity:.6}
.lg-b{fill:var(--accent)}
.lg-o{fill:var(--hit)}
#notes{display:block}
.noteread{font:800 2.6rem/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--hit);margin-bottom:10px}
#noteSlider{width:100%;height:36px;accent-color:var(--accent);cursor:pointer;margin:0}
#noteSlider:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:8px}
.ticks{display:flex;color:var(--muted);font-size:.74rem;padding:0 2px}
.ticks span{flex:1;text-align:center}
.ticks span.on{color:var(--hit);font-weight:500}
</style>
</head>
<body>
<main>
  <h1><svg class="logo" viewBox="0 0 48 48" role="img" aria-label="Chordio logo"><rect class="lg-bg" x="1" y="1" width="46" height="46" rx="12"/><g class="lg-staff"><line x1="8" y1="14" x2="40" y2="14"/><line x1="8" y1="24" x2="40" y2="24"/><line x1="8" y1="34" x2="40" y2="34"/></g><ellipse class="lg-b" cx="24" cy="34" rx="7.5" ry="5.4" transform="rotate(-20 24 34)"/><ellipse class="lg-b" cx="24" cy="24" rx="7.5" ry="5.4" transform="rotate(-20 24 24)"/><ellipse class="lg-o" cx="24" cy="14" rx="7.5" ry="5.4" transform="rotate(-20 24 14)"/></svg>Chordio</h1>

  <section class="panel" aria-labelledby="h-note">
    <h2 id="h-note">1. Your note</h2>
    <div class="tools">
      <button id="accSharp" aria-pressed="true">Sharps ♯</button>
      <button id="accFlat" aria-pressed="false">Flats ♭</button>
    </div>
    <div class="row notes" id="notes"></div>
  </section>

  <section class="panel" aria-labelledby="h-role">
    <h2 id="h-role">2. Its role in the chord</h2>
    <div class="roles" id="roles"></div>
  </section>

  <div class="result-head" id="head" aria-live="polite"></div>
  <div class="chips" id="genres" role="group" aria-label="Filter by genre"></div>
  <div id="out"></div>
</main>

<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovName">
  <div class="sheet">
    <div class="sh-head">
      <div>
        <div class="sh-name" id="ovName"></div>
        <div class="full" id="ovFull"></div>
        <div class="spell" id="ovNotes"></div>
      </div>
      <div class="sh-actions">
        <button id="ovPlay">Play</button>
        <button id="closeBtn">Close</button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="piano">Piano</button>
      <button role="tab" data-tab="ukulele">Ukulele</button>
      <button role="tab" data-tab="guitar">Guitar</button>
    </div>
    <div class="inv" id="ovInv" role="group" aria-label="Inversion"></div>
    <div id="ovBody"></div>
  </div>
</div>

<script>
(function(){
  var SHARP=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  var FLAT=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"];
  var ROLES=[
    [0,"Root","1"],[1,"♭2 / ♭9","half step up"],[2,"2 / 9","whole step up"],[3,"♭3","minor third"],
    [4,"3","major third"],[5,"4 / 11","fourth"],[6,"♭5","tritone"],[7,"5","fifth"],
    [8,"♯5 / ♭13","augmented fifth"],[9,"6 / 13","sixth"],[10,"♭7","minor seventh"],[11,"7","major seventh"]
  ];
  var GENRES=["Pop & Rock","Folk & Country","Blues","Funk & Soul","R&B & Neo-soul","Jazz","Bossa & Latin","Classical","Metal & Punk"];
  var LIB=[
    ["","Major",[0,4,7],["Pop & Rock","Folk & Country","Classical"]],
    ["m","Minor",[0,3,7],["Pop & Rock","Folk & Country","Classical","Metal & Punk"]],
    ["sus2","Suspended 2nd",[0,2,7],["Pop & Rock","Folk & Country"]],
    ["sus4","Suspended 4th",[0,5,7],["Pop & Rock","Folk & Country"]],
    ["m(add9)","Minor add 9",[0,2,3,7],["Pop & Rock","R&B & Neo-soul"]],
    ["add11","Add 11",[0,4,5,7],["Pop & Rock","Folk & Country"]],
    ["7sus4","Dominant 7 sus4",[0,5,7,10],["Pop & Rock","Funk & Soul"]],
    ["add9","Add 9",[0,2,4,7],["Folk & Country","Pop & Rock","R&B & Neo-soul"]],
    ["6","Major 6th",[0,4,7,9],["Folk & Country","Jazz","Pop & Rock"]],
    ["7","Dominant 7th",[0,4,7,10],["Blues","Funk & Soul","Jazz","Pop & Rock","Classical"]],
    ["9","Dominant 9th",[0,2,4,7,10],["Blues","Funk & Soul","Jazz"]],
    ["13","Dominant 13th",[0,2,4,7,9,10],["Blues","Jazz","Funk & Soul"]],
    ["m7","Minor 7th",[0,3,7,10],["Funk & Soul","Jazz","R&B & Neo-soul","Blues","Pop & Rock"]],
    ["m9","Minor 9th",[0,2,3,7,10],["Funk & Soul","R&B & Neo-soul","Jazz"]],
    ["7\u266f9","Dominant 7 \u266f9",[0,3,4,7,10],["Funk & Soul","Blues","Jazz"]],
    ["11","Dominant 11th",[0,2,4,5,7,10],["Funk & Soul","Jazz"]],
    ["maj9","Major 9th",[0,2,4,7,11],["R&B & Neo-soul","Jazz","Bossa & Latin"]],
    ["m11","Minor 11th",[0,2,3,5,7,10],["R&B & Neo-soul","Jazz"]],
    ["9sus4","Dominant 9 sus4",[0,2,5,7,10],["R&B & Neo-soul","Funk & Soul"]],
    ["maj7","Major 7th",[0,4,7,11],["Jazz","R&B & Neo-soul","Bossa & Latin","Pop & Rock","Classical"]],
    ["m7\u266d5","Half-diminished",[0,3,6,10],["Jazz","Bossa & Latin","Classical"]],
    ["dim7","Diminished 7th",[0,3,6,9],["Jazz","Classical"]],
    ["m(maj7)","Minor-major 7th",[0,3,7,11],["Jazz","Classical"]],
    ["7\u266d5","Dominant 7 \u266d5",[0,4,6,10],["Jazz","Classical"]],
    ["7\u266f5","Dominant 7 \u266f5",[0,4,8,10],["Jazz","Blues"]],
    ["7\u266f11","Dominant 7 \u266f11",[0,4,6,7,10],["Jazz"]],
    ["maj7\u266f5","Major 7th \u266f5",[0,4,8,11],["Jazz"]],
    ["maj13","Major 13th",[0,2,4,7,9,11],["Jazz","R&B & Neo-soul"]],
    ["m6","Minor 6th",[0,3,7,9],["Bossa & Latin","Jazz","Folk & Country"]],
    ["6/9","Six-nine",[0,2,4,7,9],["Bossa & Latin","Jazz"]],
    ["maj7\u266f11","Major 7 \u266f11",[0,4,6,7,11],["Bossa & Latin","Jazz"]],
    ["7\u266d9","Dominant 7 \u266d9",[0,1,4,7,10],["Bossa & Latin","Jazz","Classical"]],
    ["dim","Diminished",[0,3,6],["Classical","Jazz","Metal & Punk"]],
    ["aug","Augmented",[0,4,8],["Classical","Jazz"]],
    ["dim(maj7)","Diminished major 7th",[0,3,6,11],["Classical","Jazz"]],
    ["5","Power chord",[0,7],["Metal & Punk","Pop & Rock"]],
    ["m(add\u266d9)","Minor add \u266d9",[0,1,3,7],["Metal & Punk"]],
    ["m(add\u266d6)","Minor add \u266d6",[0,3,7,8],["Metal & Punk","Classical"]]
  ];
  var state={note:0,role:0,flats:false,genre:"All"};
  function hasRole(c){return c[2].indexOf(state.role)>-1}
  function groups(){
    if(state.genre==="All")return GENRES.map(function(g){return [g,LIB.filter(function(c){return c[3][0]===g&&hasRole(c)})]});
    return [[state.genre,LIB.filter(function(c){return c[3].indexOf(state.genre)>-1&&hasRole(c)})]];
  }
  function buildGenres(){
    var box=document.getElementById("genres");box.innerHTML="";
    var total=LIB.filter(hasRole).length;
    var counts={};GENRES.forEach(function(g){counts[g]=LIB.filter(function(c){return c[3].indexOf(g)>-1&&hasRole(c)}).length});
    if(state.genre!=="All"&&!counts[state.genre])state.genre="All";
    [["All",total]].concat(GENRES.map(function(g){return [g,counts[g]]})).forEach(function(x){
      var b=el("button",null,x[0]);b.appendChild(el("small",null,String(x[1])));
      b.setAttribute("aria-pressed",String(state.genre===x[0]));
      if(!x[1])b.disabled=true;
      b.onclick=function(){state.genre=x[0];render()};
      box.appendChild(b);
    });
  }
  var ctx=null;

  function names(){return state.flats?FLAT:SHARP}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

  function buildControls(){
    var n=document.getElementById("notes"),sl=document.getElementById("noteSlider");
    if(!sl){
      n.innerHTML='<div class="noteread" id="noteRead"></div><input type="range" id="noteSlider" min="0" max="11" step="1" aria-label="Note"><div class="ticks" id="ticks"></div>';
      sl=document.getElementById("noteSlider");
      sl.oninput=function(){state.note=+sl.value;render()};
    }
    sl.value=state.note;
    document.getElementById("noteRead").textContent=names()[state.note];
    document.getElementById("ticks").innerHTML=names().map(function(x,i){return '<span'+(i===state.note?' class="on"':'')+'>'+x+'</span>'}).join("");
    var r=document.getElementById("roles");r.innerHTML="";
    ROLES.forEach(function(ro){
      var b=el("button");b.appendChild(document.createTextNode(ro[1]));
      b.appendChild(el("small",null,ro[2]));
      b.setAttribute("aria-pressed",String(ro[0]===state.role));
      b.onclick=function(){state.role=ro[0];render()};r.appendChild(b);
    });
    document.getElementById("accSharp").setAttribute("aria-pressed",String(!state.flats));
    document.getElementById("accFlat").setAttribute("aria-pressed",String(state.flats));
  }

  var master=null,lastBus=null,pianoWave=null;
  function audio(){
    if(!ctx){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      var comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
      master=ctx.createGain();master.gain.value=0.9;master.connect(comp);comp.connect(ctx.destination);
      pianoWave=ctx.createPeriodicWave(new Float32Array(9),Float32Array.from([0,1,0.6,0.38,0.22,0.13,0.08,0.05,0.03]));
    }
    if(ctx.state==="suspended")ctx.resume();
  }
  function hz(m){return 440*Math.pow(2,(m-69)/12)}
  var PLUCK={
    guitar:{soft:0.85,decay:0.9935,gap:0.045,dur:1.6,peak:120,lp:4800},
    ukulele:{soft:0.55,decay:0.9955,gap:0.03,dur:1.8,peak:300,lp:3800}
  };
  function newBus(t,inst){
    if(lastBus){lastBus.gain.cancelScheduledValues(t);lastBus.gain.setTargetAtTime(0,t,0.04)}
    var g=ctx.createGain();lastBus=g;
    if(PLUCK[inst]){
      var pk=ctx.createBiquadFilter();pk.type="peaking";pk.frequency.value=PLUCK[inst].peak;pk.Q.value=1.4;pk.gain.value=6;
      var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=PLUCK[inst].lp;
      g.connect(pk);pk.connect(lp);lp.connect(master);
    }else g.connect(master);
    return g;
  }
  function pianoNote(m,t,bus,vel){
    var f=hz(m),dur=Math.max(1.2,3.6-(m-40)*0.05);
    var g=ctx.createGain(),lp=ctx.createBiquadFilter();
    lp.type="lowpass";
    lp.frequency.setValueAtTime(Math.min(9000,f*9),t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(600,f*2.2),t+0.9);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vel,t+0.006);
    g.gain.exponentialRampToValueAtTime(vel*0.4,t+0.5);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    [0,3].forEach(function(det){
      var o=ctx.createOscillator();o.setPeriodicWave(pianoWave);o.frequency.value=f;o.detune.value=det;
      o.connect(lp);o.start(t);o.stop(t+dur+0.05);
    });
    lp.connect(g);g.connect(bus);
  }
  function pluckBuf(f,o){
    var N=Math.max(2,Math.round(ctx.sampleRate/f-0.5)),sr=f*(N+0.5),len=Math.floor(o.dur*sr);
    var b=ctx.createBuffer(1,len,sr),d=b.getChannelData(0),line=new Float32Array(N),prev=0,i,idx=0,pk=0;
    for(i=0;i<N;i++){prev=prev+o.soft*((Math.random()*2-1)-prev);line[i]=prev}
    for(i=0;i<len;i++){
      var cu=line[idx],nx=line[(idx+1)%N];
      line[idx]=o.decay*0.5*(cu+nx);d[i]=cu;idx=(idx+1)%N;
      if(Math.abs(cu)>pk)pk=Math.abs(cu);
    }
    if(pk>0)for(i=0;i<len;i++)d[i]/=pk;
    return b;
  }
  function pluckNote(m,t,bus,o,vel){
    var src=ctx.createBufferSource(),g=ctx.createGain();
    src.buffer=pluckBuf(hz(m),o);g.gain.value=vel;
    src.connect(g);g.connect(bus);src.start(t);
  }
  function sound(inst,midis){
    try{
      audio();
      var t=ctx.currentTime+0.02,bus=newBus(t,inst);
      if(inst==="piano"){
        midis.forEach(function(m,i){pianoNote(m,t+i*0.004,bus,0.1)});
      }else{
        var o=PLUCK[inst];
        midis.forEach(function(m,i){pluckNote(m,t+i*o.gap,bus,o,0.3+Math.random()*0.08)});
      }
    }catch(e){}
  }
  function chordMidis(rootPc,ints,inv){
    inv=inv||0;var bp=(rootPc+ints[inv])%12;
    return [48+bp].concat(ints.map(function(i){return 60+bp+((i-ints[inv]+12)%12)}));
  }
  function playCurrent(k){
    if(!cur)return;
    var r=cur.root,c=cur.c,inv=cur.inv;
    if(tab==="piano"){sound("piano",chordMidis(r,c[2],inv));return}
    var x=cur.vs&&cur.vs[k||0];
    if(!x){sound(tab,chordMidis(r,c[2],inv));return}
    var tun=TUN[tab],m=[];
    x.v.forEach(function(f,i){if(f>=0)m.push(tun.midi[i]+f)});
    sound(tab,m);
  }

  function render(){
    buildControls();buildGenres();
    var nm=names(), role=ROLES.filter(function(r){return r[0]===state.role})[0];
    var rootPc=(state.note-state.role+12)%12;
    var head=document.getElementById("head");
    head.innerHTML="";
    head.appendChild(document.createTextNode("Chords where "));
    head.appendChild(el("em",null,nm[state.note]));
    head.appendChild(document.createTextNode(" is the "+(role[0]===0?"root":role[1].split(" / ")[0])));

    var out=document.getElementById("out");out.innerHTML="";
    groups().forEach(function(g){
      var list=g[1];
      if(!list.length)return;
      var sec=el("div","group");sec.appendChild(el("h3",null,g[0]));
      var grid=el("div","chords");
      list.forEach(function(c){
        var cr=rootPc;
        var b=el("button","chord");
        b.appendChild(el("div","name",nm[cr]+c[0]));
        b.appendChild(el("div","full",nm[cr]+" "+c[1]));
        var strip=el("div","strip");
        for(var i=0;i<12;i++){
          var pc=(cr+i)%12, cell=el("i",null,nm[pc]);
          if(c[2].indexOf(i)>-1)cell.className=(i===state.role)?"hit":"on";
          strip.appendChild(cell);
        }
        b.appendChild(strip);
        var sp=el("div","spell");
        c[2].forEach(function(i,k){
          var x=nm[(cr+i)%12];
          if(k)sp.appendChild(document.createTextNode("  "));
          if(i===state.role){var bb=el("b",null,x);sp.appendChild(bb)}else sp.appendChild(document.createTextNode(x));
        });
        b.appendChild(sp);
        b.setAttribute("aria-label","Open "+nm[cr]+" "+c[1]);
        b.onclick=function(){openChord(cr,c)};
        grid.appendChild(b);
      });
      sec.appendChild(grid);out.appendChild(sec);
    });
  }

  var TUN={
    guitar:{strings:[4,9,2,7,11,4],midi:[40,45,50,55,59,64],mute:true,label:"Strings, low to high: E A D G B E"},
    ukulele:{strings:[7,0,4,9],midi:[67,60,64,69],mute:false,label:"Strings: G C E A (the G is the high one)"}
  };
  var cur=null, tab="piano", opener=null;

  function voicings(rootPc,ints,tun,inv){
    var bassPc=(rootPc+ints[inv||0])%12;
    var n=tun.strings.length;
    var pcs=ints.map(function(i){return (rootPc+i)%12});
    var rq=ints.filter(function(i){return !(i===7&&ints.length>=4)});
    [2,5,1,6,8].forEach(function(d){var k=rq.indexOf(d);if(k>-1&&rq.length>n&&d!==state.role)rq.splice(k,1)});
    var req=rq.map(function(i){return (rootPc+i)%12});
    var minPlayed=Math.min(ints.length>=3?4:3,n), found={}, list=[];
    function check(v,s){
      var first=-1,i;
      for(i=0;i<n;i++){if(v[i]>=0){first=i;break}}
      if(first<0)return;
      var played=0,mutes=0,opens=0,fretted=[],cov={},lowP=999,lowPc=-1;
      for(i=0;i<n;i++){
        if(v[i]<0){if(i>first)return;mutes++;continue}
        played++;cov[(tun.strings[i]+v[i])%12]=1;var pt=tun.midi[i]+v[i];if(pt<lowP){lowP=pt;lowPc=(tun.strings[i]+v[i])%12}
        if(v[i]===0)opens++;else fretted.push(v[i]);
      }
      if(played<minPlayed)return;
      for(i=0;i<req.length;i++){if(!cov[req[i]])return}
      var minF=fretted.length?Math.min.apply(null,fretted):0;
      if(fretted.length&&minF!==s)return;
      if(!fretted.length&&s!==1)return;
      var atMin=0,lo=-1,hi=-1;
      for(i=0;i<n;i++){if(minF>0&&v[i]===minF){atMin++;if(lo<0)lo=i;hi=i}}
      if(atMin>=2){for(i=lo;i<=hi;i++){if(v[i]<minF)return}}
      var fingers=fretted.length-(atMin>=2?atMin-1:0);
      if(fingers>4)return;
      var key=v.join(",");
      if(found[key])return;found[key]=1;
      var score=-s*1.5-mutes*2+opens-fingers;
      if(lowPc===bassPc)score+=20;else if(inv>0)return;
      var all=true;ints.forEach(function(x){if(!cov[(rootPc+x)%12])all=false});
      if(all)score+=3;
      list.push({v:v,score:score});
    }
    for(var s=1;s<=9;s++){
      var opts=tun.strings.map(function(open){
        var o=[];
        if(tun.mute)o.push(-1);
        if(s<=4&&pcs.indexOf(open)>-1)o.push(0);
        for(var f=s;f<=s+3;f++){if(pcs.indexOf((open+f)%12)>-1)o.push(f)}
        return o;
      });
      var vv=[];
      (function dfs(i){
        if(i===n){check(vv.slice(),s);return}
        opts[i].forEach(function(f){vv[i]=f;dfs(i+1)});
      })(0);
    }
    list.sort(function(a,b){return b.score-a.score});
    return list.slice(0,3);
  }

  function diagram(v,tun,hitPc){
    var n=v.length,left=24,top=28,fh=22,rows=5,sp=(130-left-12)/(n-1),i;
    var fr=v.filter(function(f){return f>0});
    var maxF=fr.length?Math.max.apply(null,fr):0,minF=fr.length?Math.min.apply(null,fr):1;
    var start=maxF<=4?1:minF;
    var s='<svg class="dg" viewBox="0 0 130 '+(top+rows*fh+8)+'" role="img" aria-label="Chord diagram">';
    for(i=0;i<n;i++){var x=left+i*sp;s+='<line class="ln" x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+(top+rows*fh)+'"/>'}
    for(i=0;i<=rows;i++){var y=top+i*fh;s+='<line class="'+(i===0&&start===1?'nut':'ln')+'" x1="'+left+'" y1="'+y+'" x2="'+(left+(n-1)*sp)+'" y2="'+y+'"/>'}
    if(start>1)s+='<text x="1" y="'+(top+fh/2+4)+'">'+start+'fr</text>';
    for(i=0;i<n;i++){
      var x2=left+i*sp,f=v[i],pc=(tun.strings[i]+f)%12;
      if(f<0)s+='<text x="'+x2+'" y="'+(top-9)+'" text-anchor="middle">×</text>';
      else if(f===0)s+='<circle class="op'+(pc===hitPc?' hit':'')+'" cx="'+x2+'" cy="'+(top-12)+'" r="4"/>';
      else s+='<circle class="dot'+(pc===hitPc?' hit':'')+'" cx="'+x2+'" cy="'+(top+(f-start)*fh+fh/2)+'" r="7"/>';
    }
    return s+'</svg>';
  }

  function piano(rootPc,ints,roleInt,inv){
    var kw=28,bw=18,h=120,bh=72,MAX=17,WHITE=[0,2,4,5,7,9,11],nm=names(),on={},k,cls;
    inv=inv||0;var bs=(rootPc+ints[inv])%12;ints.forEach(function(i){on[bs+((i-ints[inv]+12)%12)]=(i===roleInt)?"hit":"on"});
    var s='<svg class="pk" viewBox="0 0 '+(MAX*kw)+' '+(h+2)+'" role="img" aria-label="Piano keys">';
    for(k=0;k<MAX;k++){
      var idx=Math.floor(k/7)*12+WHITE[k%7];cls=on[idx]||"";
      s+='<rect class="wk '+cls+'" x="'+(k*kw)+'" y="1" width="'+kw+'" height="'+h+'"/>';
      if(cls)s+='<text class="'+cls+'" x="'+(k*kw+kw/2)+'" y="'+(h-8)+'" text-anchor="middle">'+nm[idx%12]+'</text>';
    }
    var BL=[[1,0],[3,1],[6,3],[8,4],[10,5]];
    for(var o=0;o<3;o++){BL.forEach(function(b){
      var i2=o*12+b[0],wi=o*7+b[1];
      if(i2>28||wi>=MAX)return;
      var c2=on[i2]||"",x=(wi+1)*kw-bw/2;
      s+='<rect class="bk '+c2+'" x="'+x+'" y="1" width="'+bw+'" height="'+bh+'" rx="2"/>';
      if(c2)s+='<text class="'+c2+'" x="'+(x+bw/2)+'" y="'+(bh-8)+'" text-anchor="middle">'+nm[i2%12]+'</text>';
    })}
    return s+'</svg>';
  }

  var ov=document.getElementById("ov");
  function paint(){
    var nm=names(),r=cur.root,c=cur.c,html="";
    var inv=cur.inv,ORD=["Root position","1st inversion","2nd inversion","3rd inversion","4th inversion","5th inversion"];
    document.getElementById("ovName").textContent=nm[r]+c[0]+(inv?"/"+nm[(r+c[2][inv])%12]:"");
    var ib=document.getElementById("ovInv");
    ib.innerHTML=c[2].map(function(x,k){return '<button data-inv="'+k+'" aria-pressed="'+(k===inv)+'">'+ORD[k]+'<br><small>bass '+nm[(r+x)%12]+'</small></button>'}).join("");
    Array.prototype.forEach.call(ib.querySelectorAll("button"),function(b){
      b.onclick=function(){cur.inv=+b.getAttribute("data-inv");paint();playCurrent(0);ib.querySelector('[data-inv="'+cur.inv+'"]').focus()};
    });
    document.getElementById("ovFull").textContent=nm[r]+" "+c[1]+". Found in "+c[3].join(", ")+".";
    document.getElementById("ovNotes").textContent=c[2].map(function(i){return nm[(r+i)%12]}).join("  ");
    Array.prototype.forEach.call(ov.querySelectorAll("[data-tab]"),function(b){
      b.setAttribute("aria-selected",String(b.getAttribute("data-tab")===tab));
    });
    if(tab==="piano"){
      html=piano(r,c[2],state.role,inv)+'<p class="cap">'+ORD[inv]+'. The amber key is your note.</p>';
    }else{
      var tun=TUN[tab],vs=voicings(r,c[2],tun,inv);cur.vs=vs;
      if(!vs.length)html='<p class="cap">No easy shape found for this chord and inversion on '+tab+'.</p>';
      else{
        html='<div class="voicings">'+vs.map(function(x,i){
          return '<button class="vc" data-shape="'+i+'" aria-label="Play shape '+(i+1)+'">'+diagram(x.v,tun,state.note)+'<span class="cap">Shape '+(i+1)+', tap to hear</span></button>';
        }).join("")+'</div><p class="cap">'+tun.label+'. ×  means skip the string, ○ means open. Amber is your note.</p>';
      }
    }
    document.getElementById("ovBody").innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll("#ovBody [data-shape]"),function(b){b.onclick=function(){playCurrent(+b.getAttribute("data-shape"))}});
  }
  function openChord(rootPc,c){
    cur={root:rootPc,c:c,inv:0};opener=document.activeElement;
    ov.classList.add("open");document.body.style.overflow="hidden";
    paint();document.getElementById("closeBtn").focus();playCurrent(0);
  }
  function stopSound(){if(ctx&&lastBus){var t=ctx.currentTime;lastBus.gain.cancelScheduledValues(t);lastBus.gain.setTargetAtTime(0,t,0.03)}}
  function closeChord(){stopSound();
    ov.classList.remove("open");document.body.style.overflow="";
    if(opener&&opener.focus)opener.focus();
  }
  Array.prototype.forEach.call(ov.querySelectorAll("[data-tab]"),function(b){
    b.onclick=function(){tab=b.getAttribute("data-tab");paint();playCurrent(0)};
  });
  document.getElementById("closeBtn").onclick=closeChord;
  document.getElementById("ovPlay").onclick=function(){playCurrent(0)};
  ov.addEventListener("click",function(e){if(e.target===ov)closeChord()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ov.classList.contains("open"))closeChord()});

  document.getElementById("accSharp").onclick=function(){state.flats=false;render()};
  document.getElementById("accFlat").onclick=function(){state.flats=true;render()};
  render();
})();
</script>
